services:
  kassensturz:
    build:
      context: ../../kassensturz
      dockerfile: Dockerfile
    image: local/kassensturz:standalone
    container_name: kassensturz
    # Host-Networking unter Linux lässt die Anwendung nur an das Loopback des Hosts binden.
    # Kein Ports-Mapping ergänzen und KASSENSTURZ_HOST nicht auf 0.0.0.0 ändern.
    network_mode: host
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      KASSENSTURZ_HOST: 127.0.0.1
      KASSENSTURZ_PORT: "8099"
      KASSENSTURZ_DATA: /data
      KASSENSTURZ_LOG: INFO
      KASSENSTURZ_MASTER_KEY: ${KASSENSTURZ_MASTER_KEY:-}
      KASSENSTURZ_TRUSTED_PROXIES: ${KASSENSTURZ_TRUSTED_PROXIES:-}
      KASSENSTURZ_MOBILE_CLIENT_NETWORKS: ${KASSENSTURZ_MOBILE_CLIENT_NETWORKS:-}
      # Anmeldung an der Weboberfläche hinter einem HTTPS-Proxy auf demselben Server (siehe README).
      KASSENSTURZ_WEB_USER: ${KASSENSTURZ_WEB_USER:-}
      KASSENSTURZ_WEB_PASSWORD: ${KASSENSTURZ_WEB_PASSWORD:-}
      # Optional: Sensoren, Benachrichtigungen und Events an Home Assistant.
      KASSENSTURZ_HA_API: ${KASSENSTURZ_HA_API:-}
      KASSENSTURZ_HA_TOKEN: ${KASSENSTURZ_HA_TOKEN:-}
    volumes:
      - ./data:/data
      - ./imports:/share/kassensturz
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/healthz', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
