name: Kassensturz Mobile Test
version: "0.2.1"
slug: kassensturz-mobile-test
description: Isolierte Testinstanz für die Kassensturz-Mobile-API
url: https://github.com/uekala/kassensturz
arch:
  - aarch64
startup: application
boot: manual
init: false
ingress: true
panel_admin: true
ingress_port: 8099
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Nur für späteren privaten Tailscale-Service; standardmäßig deaktiviert
panel_icon: mdi:cash-register
panel_title: Kassensturz Test
map:
  - type: share
    read_only: false
backup_exclude:
  - "secrets.json"
  - "secrets.key"
options:
  fints_product_id: ""
  sync_time: "06:30"
  sensors: false
  notify_service: ""
  warn_threshold: 200
  import_folder: /share/kassensturz-mobile-test
  trusted_proxies: ""
  mobile_client_networks: ""
  mobile_server_url: ""
schema:
  fints_product_id: str?
  sync_time: match(^([01]\d|2[0-3]):[0-5]\d$)
  sensors: bool
  notify_service: str?
  warn_threshold: int
  import_folder: str?
  trusted_proxies: str
  mobile_client_networks: str
  mobile_server_url: str
