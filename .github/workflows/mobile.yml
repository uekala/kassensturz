name: Mobile Flutter

on:
  push:
    branches:
      - main
      - "architecture/**"
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"

permissions:
  contents: read

jobs:
  flutter-tests:
    name: Flutter analysis and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter stable
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: latest
          cache: true
          cache-sdk: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format Dart sources
        run: dart format lib test

      - name: Show formatter changes for review
        run: git diff -- lib test

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Flutter application
        run: flutter analyze --fatal-infos

      - name: Run widget tests
        run: flutter test

  android-debug:
    name: Android debug build
    runs-on: ubuntu-latest
    needs: flutter-tests
    defaults:
      run:
        working-directory: mobile/app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter stable
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: latest
          cache: true
          cache-sdk: true

      - name: Generate Android and iOS project files
        run: bash tool/bootstrap-platforms.sh

      - name: Build Android APK
        run: flutter build apk --debug

  ios-simulator:
    name: iOS simulator build
    runs-on: macos-latest
    needs: flutter-tests
    defaults:
      run:
        working-directory: mobile/app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter stable
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: latest
          cache: true
          cache-sdk: true

      - name: Generate Android and iOS project files
        run: bash tool/bootstrap-platforms.sh

      - name: Build iOS simulator app
        run: flutter build ios --simulator --debug
