name: Mobile Flutter

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - "architecture/**"
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"

permissions:
  contents: read

jobs:
  flutter-tests:
    name: Flutter analysis and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter stable
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.47.9
          cache: true
          cache-sdk: true

      - name: Install dependencies
        run: flutter pub get

      - name: Export canonical Dart formatting
        run: |
          dart format lib test
          for file in \
            lib/app/kassensturz_shell.dart \
            lib/core/data/budget_controller.dart \
            lib/core/data/budget_repository.dart \
            lib/core/data/demo_finance_data.dart \
            lib/features/accounts/accounts_page.dart \
            lib/features/budget/budget_page.dart \
            lib/features/dashboard/dashboard_page.dart \
            lib/features/more/more_page.dart \
            lib/features/transactions/transactions_page.dart \
            test/budget_repository_test.dart \
            test/widget_test.dart; do
            echo "FILE_START:$file"
            base64 -w0 "$file"
            echo
            echo "FILE_END:$file"
          done

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Flutter application
        run: flutter analyze --fatal-infos

      - name: Run widget tests
        run: flutter test

  android-debug:
    name: Android debug build
    runs-on: ubuntu-latest
    needs: flutter-tests
    defaults:
      run:
        working-directory: mobile/app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter stable
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.47.9
          cache: true
          cache-sdk: true

      - name: Generate Android and iOS project files
        run: bash tool/bootstrap-platforms.sh

      - name: Build Android APK
        run: flutter build apk --debug

  ios-simulator:
    name: iOS simulator build
    runs-on: macos-latest
    needs: flutter-tests
    defaults:
      run:
        working-directory: mobile/app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter stable
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.47.9
          cache: true
          cache-sdk: true

      - name: Generate Android and iOS project files
        run: bash tool/bootstrap-platforms.sh

      - name: Build iOS simulator app
        run: flutter build ios --simulator --debug
