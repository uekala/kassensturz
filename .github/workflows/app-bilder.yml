name: App-Bilder

# Rendert jede Seite der App mit echten Antworten des Servers und legt die Bilder
# als Artefakt an den Lauf. So lässt sich vor dem Merge ansehen, wie die App aussieht,
# und es fällt auf, wenn Server und App nicht mehr zusammenpassen.

concurrency:
  group: app-bilder-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
    paths:
      - "mobile/**"
      - "kassensturz/app/**"
      - "tools/app_fixture.py"
      - ".github/workflows/app-bilder.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bilder:
    name: Bildschirmfotos der App
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kassensturz/app/requirements.txt

      - name: Install server dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r kassensturz/app/requirements.txt
          python -m pip install httpx

      - name: Record what the server answers
        run: python tools/app_fixture.py mobile/app/tool/bilder/server.json

      - name: Set up Flutter stable
        uses: flutter-actions/setup-flutter@0e3ac53a5126c46be01612423cf26b5d59018adc # v5
        with:
          channel: stable
          version: 3.47.9
          cache: true
          cache-sdk: true

      - name: Install dependencies
        working-directory: mobile/app
        run: flutter pub get

      - name: Render the pages of the app
        working-directory: mobile/app
        run: flutter test tool/bilder/app_bilder.dart

      - name: Upload the pictures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kassensturz-app-bilder
          path: mobile/app/build/app-bilder
          if-no-files-found: error
          retention-days: 14

  vorschau:
    name: Bilder zum Ansehen ablegen
    # Legt die Bilder auf den Zweig vorschau/app-bilder, in einen Ordner je Pull Request. Dort
    # lassen sie sich im Browser und in der GitHub-App ansehen, ohne ein ZIP zu laden.
    # Eigener Job: Nur er darf schreiben, und er führt keinen Code aus dem Pull Request aus.
    # Bei Pull Requests aus fremden Forks läuft er nicht.
    needs: bilder
    if: >-
      always() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: app-bilder-vorschau
      cancel-in-progress: false
    steps:
      - name: Download the pictures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kassensturz-app-bilder
          path: bilder

      - name: Put them on the preview branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: vorschau/app-bilder
        run: |
          set -euo pipefail
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git init -q seite
          cd seite
          git config user.name "uekala"
          git config user.email "264241592+uekala@users.noreply.github.com"
          # Was schon da ist, übernehmen. Der Zweig besteht immer nur aus einem Commit,
          # damit alte Bilder das Repository nicht aufblähen.
          if git fetch -q --depth 1 "$REMOTE" "$BRANCH" 2>/dev/null; then
            git read-tree FETCH_HEAD
            git checkout-index -a -f
          fi
          rm -rf "pr-$PR"
          mkdir -p "pr-$PR"
          cp ../bilder/*.png "pr-$PR/"
          {
            echo "# App-Bilder zu Pull Request #$PR"
            echo
            echo "Gerendert mit den Beispieldaten und einem kleinen Haushalt. Stand: $(date -u +'%d.%m.%Y %H:%M') UTC, Commit ${GITHUB_SHA::7}."
            echo
            for file in "pr-$PR"/*.png; do
              name=$(basename "$file" .png)
              echo "### $name"
              echo
              echo "<img src=\"$name.png\" width=\"390\" alt=\"$name\">"
              echo
            done
          } > "pr-$PR/README.md"
          # Ordner geschlossener Pull Requests entfernen.
          offen=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json number --jq '.[].number')
          for ordner in pr-*; do
            nummer="${ordner#pr-}"
            if ! grep -qx "$nummer" <<< "$offen"; then rm -rf "$ordner"; fi
          done
          {
            echo "# App-Bilder"
            echo
            echo "Bildschirmfotos der App aus der CI, ein Ordner je offenem Pull Request. Nur Beispieldaten."
            echo
            for ordner in pr-*; do
              [ -d "$ordner" ] && echo "- [Pull Request #${ordner#pr-}]($ordner/README.md)"
            done
          } > README.md
          git add -A
          git commit -q -m "Bilder der App für offene Pull Requests"
          git push -q -f "$REMOTE" "HEAD:refs/heads/$BRANCH"
          echo "Bilder: https://github.com/${GITHUB_REPOSITORY}/tree/${BRANCH}/pr-$PR" >> "$GITHUB_STEP_SUMMARY"
