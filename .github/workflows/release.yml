name: Release

# Ein Tag wie v0.3.5 legt das GitHub-Release der Home-Assistant-App an.
# Home Assistant selbst liest die Version aus kassensturz/config.yaml auf main;
# das Release hält fest, was sich geändert hat.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  addon-release:
    name: GitHub-Release der Home-Assistant-App
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check versions
        run: |
          python3 tools/check_versions.py
          VERSION=$(sed -n 's/^version: *"\{0,1\}\([0-9.]*\).*/\1/p' kassensturz/config.yaml)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zur Version $VERSION in kassensturz/config.yaml."
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 tools/changelog_section.py kassensturz/CHANGELOG.md "$VERSION" > notes.md
          # Wurde das Release schon im Browser angelegt, nur Titel und Text ergänzen.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Kassensturz $VERSION" --notes-file notes.md \
              --prerelease=false --latest
          else
            gh release create "$GITHUB_REF_NAME" --title "Kassensturz $VERSION" --notes-file notes.md
          fi
