name: Tests

on:
  push:
    branches:
      - main
      - "architecture/**"
    paths:
      - "kassensturz/**"
      - "tests/**"
      - ".github/workflows/tests.yml"
      - "deploy/standalone/**"
      - "deploy/home-assistant-green/**"
      - "mobile/app/tool/**"
  pull_request:
    branches:
      - main
    paths:
      - "kassensturz/**"
      - "tests/**"
      - ".github/workflows/tests.yml"
      - "deploy/standalone/**"
      - "deploy/home-assistant-green/**"
      - "mobile/app/tool/**"

permissions:
  contents: read

jobs:
  python-tests:
    name: python-tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.15 is the version in the add-on image (python:3.15-slim-bookworm).
        python-version: ["3.12", "3.15"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: kassensturz/app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r kassensturz/app/requirements.txt
          python -m pip install pytest httpx

      - name: Check dashboard JavaScript syntax
        run: node --check kassensturz/app/kassensturz/static/app.js

      - name: Run tests
        env:
          KASSENSTURZ_DEV: "1"
          KASSENSTURZ_NO_BACKGROUND: "1"
        run: python -m pytest -q tests

  standalone-compose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate standalone Compose configuration
        run: bash deploy/standalone/check-config.sh
      - name: Build standalone Docker image
        run: docker compose -f deploy/standalone/docker-compose.yml build

  home-assistant-green-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Enable ARM64 emulation
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Home Assistant add-on image for Home Assistant Green
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --tag kassensturz-ha-addon:green-test \
            --file kassensturz/Dockerfile \
            --load \
            kassensturz
