name: Tests

on:
  push:
    branches:
      - main
      - "architecture/**"
    paths:
      - "kassensturz/**"
      - "tests/**"
      - ".github/workflows/tests.yml"
      - "deploy/standalone/**"
      - "deploy/home-assistant-green/**"
      - "mobile/app/tool/**"
  pull_request:
    branches:
      - main
    paths:
      - "kassensturz/**"
      - "tests/**"
      - ".github/workflows/tests.yml"
      - "deploy/standalone/**"
      - "deploy/home-assistant-green/**"
      - "mobile/app/tool/**"

permissions:
  contents: read

jobs:
  python-tests:
    name: python-tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.15 ist die Version im Add-on-Image (python:3.15-slim-bookworm).
        python-version: ["3.12", "3.15"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: kassensturz/app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r kassensturz/app/requirements.txt
          python -m pip install pytest httpx

      - name: Check dashboard JavaScript syntax
        # Die Oberfläche besteht aus ES-Modulen; als .mjs prüft Node sie unabhängig von der Version als Modul.
        run: |
          for f in kassensturz/app/kassensturz/static/app.js kassensturz/app/kassensturz/static/js/*.js; do
            cp "$f" "$RUNNER_TEMP/check.mjs"
            node --check "$RUNNER_TEMP/check.mjs" || { echo "Syntaxfehler in $f"; exit 1; }
          done

      - name: Run tests
        env:
          KASSENSTURZ_DEV: "1"
          KASSENSTURZ_NO_BACKGROUND: "1"
        run: python -m pytest -q tests

  standalone-compose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate standalone Compose configuration
        run: bash deploy/standalone/check-config.sh
      - name: Build standalone Docker image
        run: docker compose -f deploy/standalone/docker-compose.yml build

  home-assistant-green-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable ARM64 emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Home Assistant add-on image for Home Assistant Green
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --tag kassensturz-ha-addon:green-test \
            --file kassensturz/Dockerfile \
            --load \
            kassensturz
