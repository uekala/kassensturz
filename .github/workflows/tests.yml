name: Tests

on:
  push:
    branches:
      - main
      - "architecture/**"
    paths:
      - "kassensturz/**"
      - "tests/**"
      - ".github/workflows/tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "kassensturz/**"
      - "tests/**"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kassensturz/app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r kassensturz/app/requirements.txt
          python -m pip install pytest httpx

      - name: Run tests
        env:
          KASSENSTURZ_DEV: "1"
          KASSENSTURZ_NO_BACKGROUND: "1"
        run: python -m pytest -q tests
