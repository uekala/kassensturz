name: Temporary mobile formatter
on:
  push:
    branches:
      - feature/mobile-accounts-budgets-clean
    paths:
      - .github/workflows/temporary-format-mobile.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/mobile-accounts-budgets-clean
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.47.9
          cache: true
      - name: Install dependencies and format
        working-directory: mobile/app
        run: |
          flutter pub get
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test
      - name: Commit formatting-only changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add mobile/app/lib mobile/app/test
            git commit -m "Apply dependency-aware Dart formatting"
            git push origin HEAD:feature/mobile-accounts-budgets-clean
          fi
