name: Temporary mobile formatter verification
on:
  push:
    branches:
      - feature/mobile-server-accounts-budgets
    paths:
      - .github/workflows/temporary-format-mobile.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/mobile-server-accounts-budgets
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.47.9
          cache: true
      - name: Format and verify
        working-directory: mobile/app
        run: |
          flutter --version
          dart --version
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test
      - name: Commit formatted files
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add mobile/app/lib/features/accounts/server_finance_pages.dart
            git commit -m "Apply Dart formatting"
            git push origin HEAD:feature/mobile-server-accounts-budgets
          fi
