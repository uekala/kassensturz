configuration:
  fints_product_id:
    name: FinTS-Produkt-ID
    description: Registrierungsnummer von der Deutschen Kreditwirtschaft (fints.org). Ohne sie funktioniert nur der Datei-Import.
  sync_time:
    name: Uhrzeit für den automatischen Abruf
    description: Täglicher Abruf für Bankzugänge mit gespeicherter PIN (HH:MM).
  sensors:
    name: Sensoren in Home Assistant anlegen
    description: Kontostand, Prognose, Fixkosten und Budgets als sensor.kassensturz_* bereitstellen.
  notify_service:
    name: Benachrichtigungsdienst
    description: "Optional, z. B. notify.mobile_app_pixel. Leer lassen für persistente Benachrichtigungen in Home Assistant."
  notify_new_transactions:
    name: Bei neuen Buchungen benachrichtigen
    description: Meldet Buchungen aus dem automatischen Abruf und dem Eingangsordner. Selbst importierte oder angelegte Buchungen werden nicht gemeldet.
  warn_threshold:
    name: Warnschwelle in Euro
    description: Warnen, wenn der prognostizierte Kontostand unter diesen Betrag fällt.
  cancellation_reminder_days:
    name: Erinnerungen vor Kündigungsfrist (Tage)
    description: Kommagetrennte Tage vor Fristende, z. B. 45,21,7. Größter Wert ist die erste Warnung, kleinster Wert die kritische letzte Warnung. Erlaubt sind 1 bis 365.
  import_folder:
    name: Eingangsordner
    description: Kontoauszug-Dateien, die hier landen, werden automatisch importiert. Leer lassen zum Abschalten.
  trusted_proxies:
    name: Vertrauenswürdige Proxys (Mobile App)
    description: Kommagetrennte IP-Adressen oder Netze, von denen die Mobile-Schnittstelle HTTPS-Anfragen annimmt, z. B. 172.30.32.1/32 für den Tailscale-Service. Leer lassen, wenn keine Mobile App verbunden wird.
  mobile_client_networks:
    name: Erlaubte Client-Netze (Mobile App)
    description: Kommagetrennte private Netze, aus denen Geräte die Mobile-Schnittstelle direkt per HTTPS erreichen dürfen. Für den Weg über den Tailscale-Service leer lassen.
  mobile_server_url:
    name: Serveradresse für die Mobile App
    description: HTTPS-Adresse ohne Pfad, die im QR-Code zum Koppeln steht, z. B. https://kassensturz-prod.example.ts.net. Leer lassen schaltet den QR-Code ab.
