configuration:
  fints_product_id:
    name: FinTS product ID
    description: Registration number from Deutsche Kreditwirtschaft (fints.org). Without it only file import works.
  sync_time:
    name: Time of the automatic sync
    description: Daily sync for bank logins with a saved PIN (HH:MM).
  sensors:
    name: Create sensors in Home Assistant
    description: Provide balance, forecast, fixed costs and budgets as sensor.kassensturz_*.
  notify_service:
    name: Notification service
    description: "Optional, e.g. notify.mobile_app_pixel. Leave empty for persistent notifications."
  notify_new_transactions:
    name: Notify about new transactions
    description: Reports transactions from the automatic sync and the import folder. Transactions you import or add yourself are not reported.
  warn_threshold:
    name: Warning threshold in euros
    description: Warn when the forecast balance drops below this amount.
  cancellation_reminder_days:
    name: Cancellation reminders before deadline (days)
    description: Comma-separated days before the deadline, e.g. 45,21,7. The largest value is the first warning; the smallest is the final critical warning. Allowed range is 1 to 365.
  import_folder:
    name: Import folder
    description: Statement files placed here are imported automatically. Leave empty to disable.
  trusted_proxies:
    name: Trusted proxies (mobile app)
    description: Comma-separated IP addresses or networks the mobile API accepts HTTPS requests from, e.g. 172.30.32.1/32 for the Tailscale service. Leave empty if no mobile app is connected.
  mobile_client_networks:
    name: Allowed client networks (mobile app)
    description: Comma-separated private networks from which devices may reach the mobile API directly over HTTPS. Leave empty when using the Tailscale service.
  mobile_server_url:
    name: Server address for the mobile app
    description: HTTPS address without a path that is put into the pairing QR code, e.g. https://kassensturz-prod.example.ts.net. Leave empty to disable the QR code.
