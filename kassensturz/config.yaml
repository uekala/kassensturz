name: Kassensturz
version: "0.3.13"
slug: kassensturz
description: Haushaltsbuch mit Bankabruf per FinTS und Open Banking, Eingangsordner, Vertragserkennung, Budgets und Prognose
url: https://github.com/uekala/kassensturz
arch:
  - aarch64
  - amd64
startup: application
boot: auto
ingress: true
panel_admin: true
ingress_port: 8099
# Antwortet die App nicht mehr, startet Home Assistant sie neu.
watchdog: "http://[HOST]:[PORT:8099]/healthz"
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Nur für den privaten Tailscale-Service; standardmäßig deaktiviert und nicht am Router freigeben
panel_icon: mdi:cash-register
panel_title: Kassensturz
homeassistant_api: true
map:
  - type: share
    read_only: false
# Home Assistant stops the app during a backup, so the SQLite database
# (WAL mode) is never copied mid-write.
backup: cold
backup_exclude:
  - "secrets.json"
  - "secrets.key"
  # Eigene Kopien der Datenbank; die Sicherung enthält die Datenbank selbst.
  - "backups/*"
options:
  fints_product_id: ""
  sync_time: "06:30"
  sensors: true
  notify_service: ""
  notify_new_transactions: true
  warn_threshold: 200
  cancellation_reminder_days: "45,21,7"
  import_folder: /share/kassensturz
  trusted_proxies: ""
  mobile_client_networks: ""
  mobile_server_url: ""
schema:
  fints_product_id: str?
  sync_time: match(^([01]\d|2[0-3]):[0-5]\d$)
  sensors: bool
  notify_service: str?
  notify_new_transactions: bool
  warn_threshold: int
  cancellation_reminder_days: str
  import_folder: str?
  trusted_proxies: str
  mobile_client_networks: str
  mobile_server_url: str
