name: Kassensturz
version: "0.1.0"
slug: kassensturz
description: Haushaltsbuch mit Bankabruf per FinTS, CSV-Import, Vertragserkennung, Budgets und Kontostand-Prognose
url: https://github.com/uekala/kassensturz
arch:
  - aarch64
  - amd64
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:cash-register
panel_title: Kassensturz
homeassistant_api: true
backup_exclude:
  - "secrets.json"
options:
  fints_product_id: ""
  sync_time: "06:30"
  sensors: true
  notify_service: ""
  warn_threshold: 200
schema:
  fints_product_id: str?
  sync_time: match(^([01]\d|2[0-3]):[0-5]\d$)
  sensors: bool
  notify_service: str?
  warn_threshold: int
