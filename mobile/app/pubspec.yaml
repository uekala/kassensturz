name: kassensturz_mobile
description: Local-first companion app for a user's Kassensturz server.
publish_to: none
version: 0.3.15+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  mobile_scanner: ^7.5.0
  url_launcher: ^6.3.1
  local_auth: ^3.0.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL-Inter.txt
    - assets/fonts/OFL-SpaceGrotesk.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
    - family: Inter Ext
      fonts:
        - asset: assets/fonts/InterExt-400.ttf
          weight: 400
        - asset: assets/fonts/InterExt-500.ttf
          weight: 500
        - asset: assets/fonts/InterExt-600.ttf
          weight: 600
        - asset: assets/fonts/InterExt-700.ttf
          weight: 700
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-600.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-700.ttf
          weight: 700
    - family: Space Grotesk Ext
      fonts:
        - asset: assets/fonts/SpaceGroteskExt-600.ttf
          weight: 600
        - asset: assets/fonts/SpaceGroteskExt-700.ttf
          weight: 700
